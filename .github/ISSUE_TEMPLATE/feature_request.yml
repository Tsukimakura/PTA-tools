name: 功能建议
description: 提议新的命令、题型支持或工作流改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述真实使用场景和希望解决的问题。涉及远端写操作时，请明确说明可能的外部副作用。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 当前流程中遇到了什么问题？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的命令、交互方式或输出格式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 是否考虑过脚本组合、现有子命令或其他替代方式？

  - type: dropdown
    id: side_effect
    attributes:
      label: 是否包含外部写操作
      options:
        - 否，仅查询或生成本地输出
        - 是，会向 PTA 提交或改变考试状态
        - 是，会发送钉钉或其他外部消息
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 该建议不用于作弊、绕过考试限制或滥用平台接口。
          required: true
